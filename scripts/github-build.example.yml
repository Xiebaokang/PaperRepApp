name: Build desktop installers
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            command: build:mac
          - os: windows-latest
            command: build:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.command }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PaperRep-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.exe
